<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Builder Agent</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404s to index.html with the current path preserved
      var segmentCount = 1;
      var loc = window.location;
      loc.replace(
        loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
        loc.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/#' +
        loc.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (loc.search ? '?' + loc.search.slice(1) : '') +
        loc.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
